name: Deploy Portfolio to Pages

on:
  push:
    branches: [main]
  # Monthly rebuild: security.txt expires 180 days after the build.
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

# Read-only by default; only the deploy job can publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static Astro site
    runs-on: ubuntu-latest
    # No Pages write or OIDC token here: npm ci runs install scripts.
    permissions:
      contents: read
      pages: read # configure-pages reads the site settings
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install dependencies
        run: npm ci
      - name: Check and build with Astro
        run: npm run check
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
